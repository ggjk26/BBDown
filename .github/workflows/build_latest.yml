name: Build Latest

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bbdown-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2025
          - rid: win-arm64
            runner: windows-11-arm
          - rid: linux-x64
            runner: ubuntu-22.04
          - rid: linux-arm64
            runner: ubuntu-22.04-arm
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Install Native AOT dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang zlib1g-dev

      - name: Publish Native AOT executable
        run: dotnet publish BBDown/BBDown.csproj --configuration Release --runtime ${{ matrix.rid }} --output publish

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Join-Path $PWD "publish/BBDown.exe"
          if (!(Test-Path $binary)) {
            throw "Native AOT output not found: $binary"
          }
          $archive = "BBDown_${{ matrix.rid }}_${{ github.sha }}.zip"
          Compress-Archive -Path $binary -DestinationPath $archive -CompressionLevel Optimal

      - name: Package Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          test -x publish/BBDown
          zip -j "BBDown_${{ matrix.rid }}_${{ github.sha }}.zip" publish/BBDown

      - name: Upload precompiled build
        uses: actions/upload-artifact@v7
        with:
          name: BBDown_${{ matrix.rid }}_${{ github.sha }}
          path: BBDown_${{ matrix.rid }}_${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 30
